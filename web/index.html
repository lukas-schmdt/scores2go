<!DOCTYPE html>
<html lang="de">
<head>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- iOS splash screens -->
  <!-- iPhone 16 Pro Max (440x956) -->

  <!-- iPhone 16 Pro (402x874) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/Icon-512.png">
  <!-- iPhone 15 / 16 (393x852) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/Icon-512.png">
  <!-- iPhone SE (375x667) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/Icon-512.png">
  <!-- iPad Pro 13" (1024x1366) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/Icon-512.png">
  <!-- iPad Pro 11" (834x1194) -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Scores2Go</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #02122B;
    }

    /* ── Splash screen ── */
    #splash {
      position: fixed;
      inset: 0;
      background: #02122B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-icon {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(1, 118, 228, 0.45);
      animation: splash-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .splash-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .splash-title {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      animation: splash-fade-up 0.5s 0.1s ease both;
    }

    .splash-title .teal { color: #0DBBBA; }
    .splash-title .blue { color: #0176E4; }

    .splash-subtitle {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.35);
      animation: splash-fade-up 0.5s 0.18s ease both;
    }

    @keyframes splash-pop {
      from { opacity: 0; transform: scale(0.72); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes splash-fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Splash screen: visible until Flutter renders its first frame -->
  <div id="splash">
    <div class="splash-icon">
      <svg width="96" height="96" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="300" rx="24" fill="url(#splashGrad)"/>
        <path d="M179 30C187.837 30 195 37.1634 195 46V105H254C262.837 105 270 112.163 270 121V179C270 187.837 262.837 195 254 195H195V254C195 262.837 187.837 270 179 270H121C112.163 270 105 262.837 105 254V195H46C37.1634 195 30 187.837 30 179V121C30 112.163 37.1634 105 46 105H105V46C105 37.1634 112.163 30 121 30H179Z" fill="white" fill-opacity="0.26"/>
        <path d="M213.37 98.0737V82.7907H101.439L167.303 145.661C171.427 149.602 171.371 155.727 167.171 159.601L102.051 219.71H213.368V210.48C213.368 204.887 218.495 200.338 224.798 200.338C231.099 200.338 236.232 204.887 236.232 210.48V229.853C236.232 235.448 231.102 240 224.798 240H75.2014C70.6141 240 66.4833 237.58 64.6837 233.829C62.8832 230.08 63.7795 225.76 66.9591 222.822L143.2 152.453L66.8286 79.5535C63.7341 76.596 62.9063 72.296 64.7217 68.5932C66.539 64.8919 70.6542 62.5 75.2014 62.5H224.801C231.102 62.5 236.234 67.0503 236.234 72.6468V98.0737C236.234 103.667 231.104 108.219 224.801 108.219C218.497 108.219 213.37 103.669 213.37 98.0737Z" fill="white" style="filter:drop-shadow(0 4px 4px rgba(0,0,0,0.4))"/>
        <defs>
          <linearGradient id="splashGrad" x1="300" y1="300" x2="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0176E4"/>
            <stop offset="1" stop-color="#0DBBBA"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="splash-title">Scores<span class="teal">2</span><span class="blue">Go</span></div>
    <div class="splash-subtitle">Clinical Scoring</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () { splash.remove(); }, 500);
    });
  </script>
</body>
</html>
