<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scores2Go</title>
  <meta name="description" content="Open-source clinical scoring app for research and educational purposes." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <div class="container">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg width="56" height="56" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:14px;">
            <rect width="300" height="300" rx="24" fill="url(#lg)"/>
            <path d="M179 30C187.837 30 195 37.1634 195 46V105H254C262.837 105 270 112.163 270 121V179C270 187.837 262.837 195 254 195H195V254C195 262.837 187.837 270 179 270H121C112.163 270 105 262.837 105 254V195H46C37.1634 195 30 187.837 30 179V121C30 112.163 37.1634 105 46 105H105V46C105 37.1634 112.163 30 121 30H179Z" fill="white" fill-opacity="0.26"/>
            <path d="M213.37 98.0737V82.7907H101.439L167.303 145.661C171.427 149.602 171.371 155.727 167.171 159.601L102.051 219.71H213.368V210.48C213.368 204.887 218.495 200.338 224.798 200.338C231.099 200.338 236.232 204.887 236.232 210.48V229.853C236.232 235.448 231.102 240 224.798 240H75.2014C70.6141 240 66.4833 237.58 64.6837 233.829C62.8832 230.08 63.7795 225.76 66.9591 222.822L143.2 152.453L66.8286 79.5535C63.7341 76.596 62.9063 72.296 64.7217 68.5932C66.539 64.8919 70.6542 62.5 75.2014 62.5H224.801C231.102 62.5 236.234 67.0503 236.234 72.6468V98.0737C236.234 103.667 231.104 108.219 224.801 108.219C218.497 108.219 213.37 103.669 213.37 98.0737Z" fill="white" style="filter:drop-shadow(0 4px 4px rgba(0,0,0,0.4))"/>
            <defs>
              <linearGradient id="lg" x1="300" y1="300" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0176E4"/>
                <stop offset="1" stop-color="#0DBBBA"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h1>Scores<span class="teal">2</span>Go</h1>
      <p class="eyebrow">Open Source Clinical Scoring App</p>
      <p class="lead">Fast access to clinical scores and calculators.<br/>For research and educational purposes only.</p>

      <!-- Score search -->
      <div class="scores">
        <p class="scores-label">Find a Score</p>

        <div class="score-search" style="position:relative;max-width:560px;margin:0 auto;">
          <input
            id="scoreSearch"
            type="text"
            placeholder="Search scores..."
            autocomplete="off"
            aria-label="Search scores"
            style="width:100%;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.08);color:#fff;font-size:1rem;outline:none;box-sizing:border-box;"
          />

          <div
            id="scoreSuggestions"
            style="display:none;position:absolute;top:calc(100% + 10px);left:0;right:0;background:#101828;border:1px solid rgba(255,255,255,0.10);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.28);z-index:20;"
          ></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <a class="button primary" href="./app/">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          Launch App
        </a>
        <a class="button secondary" href="https://github.com/lukas-schmdt/scores2go">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
      </div>

      <p class="disclaimer">For research and educational purposes only. Not for clinical decision-making.</p>
    </div>
  </main>

  <script>
    const scores = [
      {
        name: "APACHE II",
        description: "ICU severity & mortality prediction",
        href: "./scores/apache2.html"
      },
      {
        name: "SOFA",
        description: "Sequential Organ Failure Assessment",
        href: "./scores/sofa.html"
      },
      {
        name: "SAPS II",
        description: "Simplified Acute Physiology Score II",
        href: "./scores/saps2.html"
      },
      {
        name: "NEWS2",
        description: "National Early Warning Score 2",
        href: "./scores/news2.html"
      },
      {
        name: "qSOFA",
        description: "Quick sepsis risk assessment",
        href: "./scores/qsofa.html"
      }
    ];

    const searchInput = document.getElementById("scoreSearch");
    const suggestions = document.getElementById("scoreSuggestions");

    function renderSuggestions(items) {
      if (!items.length) {
        suggestions.innerHTML = `
          <div style="padding:14px 16px;color:rgba(255,255,255,0.75);font-size:0.95rem;">
            No scores found
          </div>
        `;
        suggestions.style.display = "block";
        return;
      }

      suggestions.innerHTML = items.map(score => `
        <a
          href="${score.href}"
          style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;text-decoration:none;color:#fff;border-bottom:1px solid rgba(255,255,255,0.08);"
          onmouseover="this.style.background='rgba(255,255,255,0.06)'"
          onmouseout="this.style.background='transparent'"
        >
          <span>
            <span style="display:block;font-weight:600;">${score.name}</span>
            <span style="display:block;font-size:0.92rem;color:rgba(255,255,255,0.72);margin-top:2px;">${score.description}</span>
          </span>
          <span style="font-size:1.1rem;color:rgba(255,255,255,0.7);">→</span>
        </a>
      `).join("");

      suggestions.style.display = "block";
    }

    function filterScores(query) {
      const normalized = query.trim().toLowerCase();

      if (!normalized) {
        return scores;
      }

      return scores.filter(score =>
        score.name.toLowerCase().includes(normalized) ||
        score.description.toLowerCase().includes(normalized)
      );
    }

    searchInput.addEventListener("focus", () => {
      renderSuggestions(filterScores(searchInput.value));
    });

    searchInput.addEventListener("input", (e) => {
      renderSuggestions(filterScores(e.target.value));
    });

    document.addEventListener("click", (e) => {
      if (!searchInput.closest(".score-search").contains(e.target)) {
        suggestions.style.display = "none";
      }
    });
  </script>
</body>
</html>
